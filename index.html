<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>쉽게 배우는 사자성어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f3e8;
  --paper-dark:#efe7d2;
  --ink:#2c2a26;
  --ink-soft:#5a554b;
  --green:#7cb342;
  --green-deep:#5a9216;
  --green-soft:#dcedc1;
  --yellow:#f4c430;
  --yellow-soft:#fdf1c4;
  --red:#e0533d;
  --red-soft:#f9dcd5;
  --blue:#3f7cac;
  --plum:#9c4f96;
  --stamp:#d24a3a;
  --line:rgba(90,85,75,.18);
  --shadow:0 8px 28px rgba(70,60,30,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Gowun Dodum',sans-serif;
  background:
    radial-gradient(circle at 12% 8%, rgba(124,179,66,.10), transparent 42%),
    radial-gradient(circle at 88% 92%, rgba(244,196,48,.12), transparent 45%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
/* 한지결 텍스처 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:repeating-linear-gradient(90deg,rgba(120,110,80,.035) 0 1px,transparent 1px 26px);
}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px 48px;}

/* ===== 헤더 ===== */
header{padding:26px 4px 8px;text-align:center;position:relative;}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--green);color:#fff;font-family:'Gowun Dodum';
  font-size:12.5px;letter-spacing:2px;padding:6px 18px;border-radius:30px;
  box-shadow:0 4px 0 var(--green-deep);
}
.badge .dot{width:5px;height:5px;border-radius:50%;background:#fff;}
h1{
  font-family:'Noto Serif KR';font-weight:900;
  font-size:34px;margin:14px 0 2px;letter-spacing:-1px;color:var(--ink);
}
h1 .han{color:var(--green-deep);}
.subtitle{font-size:13px;color:var(--ink-soft);letter-spacing:.5px;margin-top:2px;}

/* ===== 탭 ===== */
.tabs{display:flex;gap:8px;margin:20px 0 18px;background:var(--paper-dark);
  padding:6px;border-radius:18px;box-shadow:inset 0 2px 5px rgba(120,100,60,.12);}
.tab{
  flex:1;border:none;background:transparent;cursor:pointer;
  font-family:'Gowun Dodum';font-size:14.5px;color:var(--ink-soft);
  padding:11px 4px;border-radius:13px;transition:.22s;font-weight:600;
}
.tab.active{background:#fff;color:var(--green-deep);box-shadow:var(--shadow);}

.view{animation:fade .4s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.hidden{display:none;}

/* ===== 학습 카드 (플래시) ===== */
.deck-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:0 2px;}
.deck-title{font-family:'Nanum Myeongjo';font-weight:800;font-size:17px;}
.deck-count{font-size:12.5px;color:var(--ink-soft);background:var(--yellow-soft);
  padding:5px 12px;border-radius:20px;border:1px solid rgba(244,196,48,.4);}

.flash{
  background:#fffdf7;border-radius:26px;padding:30px 24px 26px;
  box-shadow:var(--shadow);border:2px solid #fff;position:relative;overflow:hidden;
  min-height:430px;display:flex;flex-direction:column;
}
.flash::after{ /* "참 잘했어요" 도장 느낌 */
  content:"";position:absolute;right:-30px;bottom:-30px;width:150px;height:150px;
  background:radial-gradient(circle,rgba(124,179,66,.10),transparent 70%);border-radius:50%;
}
.flash .tag{align-self:center;background:var(--green-soft);color:var(--green-deep);
  font-size:12px;padding:5px 16px;border-radius:20px;letter-spacing:1.5px;margin-bottom:18px;font-weight:600;}
.flash .kor{
  font-family:'Noto Serif KR';font-weight:900;text-align:center;
  font-size:34px;letter-spacing:-1px;color:var(--ink);line-height:1.15;
}
.flash .han{
  font-family:'Nanum Myeongjo';font-weight:800;text-align:center;
  font-size:40px;color:var(--green-deep);margin-top:6px;letter-spacing:6px;
}
.hunmum-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 8px;}
.hun-chip{
  background:var(--paper);border:1.5px solid var(--line);border-radius:14px;
  padding:9px 6px;text-align:center;min-width:62px;flex:1;max-width:80px;
}
.hun-chip .c{font-family:'Nanum Myeongjo';font-weight:800;font-size:24px;color:var(--ink);display:block;}
.hun-chip .r{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
.sec-label{display:flex;align-items:center;gap:8px;margin:22px 0 8px;}
.sec-label b{font-family:'Nanum Myeongjo';color:var(--plum);font-size:14px;font-weight:800;letter-spacing:1px;}
.sec-label .ln{flex:1;height:1px;background:var(--line);}
.flash .meaning{font-size:16px;line-height:1.6;color:var(--ink);text-align:center;}
.flash .origin{
  font-size:13.5px;line-height:1.7;color:var(--ink-soft);
  background:var(--yellow-soft);border-radius:16px;padding:14px 16px;margin-top:6px;
  border:1px dashed rgba(214,170,40,.5);
}
.flash-foot{margin-top:auto;}

.read-btn{
  width:100%;margin-top:18px;border:none;cursor:pointer;
  background:var(--blue);color:#fff;font-family:'Gowun Dodum';font-size:15px;font-weight:600;
  padding:14px;border-radius:16px;box-shadow:0 4px 0 #2f6184;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:.12s;
}
.read-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2f6184;}
.read-btn.playing{background:var(--green);box-shadow:0 4px 0 var(--green-deep);}

.nav-row{display:flex;gap:10px;margin-top:12px;}
.nav-btn{
  flex:1;border:none;cursor:pointer;background:#fff;color:var(--ink);
  font-family:'Gowun Dodum';font-size:15px;font-weight:600;padding:14px;border-radius:16px;
  box-shadow:var(--shadow);border:1.5px solid var(--line);transition:.12s;
}
.nav-btn:active{transform:scale(.97);}
.nav-btn.primary{background:var(--green);color:#fff;border-color:var(--green-deep);box-shadow:0 4px 0 var(--green-deep);}
.nav-btn:disabled{opacity:.4;}

.progress{height:7px;background:var(--paper-dark);border-radius:10px;margin:16px 0 4px;overflow:hidden;}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow));border-radius:10px;transition:width .35s;}

/* 학습 목록 검색 */
.search{
  width:100%;border:1.5px solid var(--line);background:#fffdf7;border-radius:16px;
  padding:13px 16px;font-family:'Gowun Dodum';font-size:15px;color:var(--ink);margin-bottom:14px;
}
.search:focus{outline:none;border-color:var(--green);}
.mini-list{display:flex;flex-direction:column;gap:9px;}
.mini{
  background:#fffdf7;border:1.5px solid var(--line);border-radius:16px;padding:13px 16px;cursor:pointer;
  display:flex;align-items:center;gap:12px;transition:.15s;
}
.mini:active{background:var(--green-soft);}
.mini .mk{font-family:'Noto Serif KR';font-weight:700;font-size:17px;min-width:74px;}
.mini .mh{font-family:'Nanum Myeongjo';font-weight:700;color:var(--green-deep);font-size:16px;letter-spacing:2px;min-width:74px;}
.mini .mm{font-size:12.5px;color:var(--ink-soft);line-height:1.4;flex:1;}
.mini .star{color:var(--yellow);font-size:13px;}

/* ===== 퀴즈 ===== */
.quiz-setup{background:#fffdf7;border-radius:24px;padding:26px 22px;box-shadow:var(--shadow);border:2px solid #fff;}
.quiz-setup h2{font-family:'Nanum Myeongjo';font-weight:800;font-size:20px;margin:0 0 6px;text-align:center;}
.quiz-setup p{font-size:13.5px;color:var(--ink-soft);text-align:center;line-height:1.6;margin:0 0 22px;}
.opt-group{margin-bottom:20px;}
.opt-group > label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:10px;letter-spacing:.5px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{
  border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 16px;cursor:pointer;
  font-family:'Gowun Dodum';font-size:14px;color:var(--ink-soft);transition:.15s;flex:1;text-align:center;min-width:70px;
}
.chip.sel{background:var(--green);color:#fff;border-color:var(--green-deep);box-shadow:0 3px 0 var(--green-deep);}
.start-btn{
  width:100%;border:none;cursor:pointer;background:var(--red);color:#fff;
  font-family:'Nanum Myeongjo';font-weight:800;font-size:17px;padding:16px;border-radius:18px;
  box-shadow:0 5px 0 #b13a29;transition:.12s;margin-top:6px;
}
.start-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b13a29;}

.qbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;color:var(--ink-soft);}
.qbar .score{background:var(--green-soft);color:var(--green-deep);padding:4px 12px;border-radius:14px;font-weight:600;}

.qcard{background:#fffdf7;border-radius:24px;padding:26px 22px;box-shadow:var(--shadow);border:2px solid #fff;margin-top:10px;}
.qtype{text-align:center;font-size:12px;color:var(--plum);letter-spacing:1.5px;margin-bottom:14px;font-weight:600;}
.qprompt{text-align:center;margin-bottom:22px;}
.qprompt .qbig{font-family:'Noto Serif KR';font-weight:900;font-size:30px;letter-spacing:-.5px;line-height:1.25;}
.qprompt .qhan{font-family:'Nanum Myeongjo';font-weight:800;font-size:38px;color:var(--green-deep);letter-spacing:5px;}
.qprompt .qmean{font-size:16.5px;line-height:1.55;color:var(--ink);padding:0 6px;}
.qprompt .qlabel{font-size:12.5px;color:var(--ink-soft);margin-top:10px;}

.answers{display:flex;flex-direction:column;gap:10px;}
.ans{
  border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:15px 18px;cursor:pointer;
  font-family:'Gowun Dodum';font-size:15.5px;color:var(--ink);text-align:left;transition:.15s;
  display:flex;align-items:center;gap:10px;line-height:1.4;
}
.ans .num{width:24px;height:24px;border-radius:50%;background:var(--paper-dark);color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.ans:active{transform:scale(.98);}
.ans.correct{background:var(--green-soft);border-color:var(--green);color:var(--green-deep);font-weight:600;}
.ans.correct .num{background:var(--green);color:#fff;}
.ans.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red);}
.ans.wrong .num{background:var(--red);color:#fff;}
.ans.disabled{pointer-events:none;opacity:.55;}
.ans.correct.disabled,.ans.wrong.disabled{opacity:1;}

.feedback{text-align:center;margin-top:18px;animation:fade .3s;}
.feedback .fmark{font-size:30px;}
.feedback .ftext{font-size:14px;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
.next-btn{
  width:100%;border:none;cursor:pointer;background:var(--green);color:#fff;
  font-family:'Gowun Dodum';font-weight:600;font-size:15px;padding:14px;border-radius:16px;
  box-shadow:0 4px 0 var(--green-deep);margin-top:16px;transition:.12s;
}
.next-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-deep);}

/* 결과 */
.result{background:#fffdf7;border-radius:26px;padding:34px 24px;box-shadow:var(--shadow);border:2px solid #fff;text-align:center;}
.result .stamp{
  width:120px;height:120px;margin:0 auto 16px;border-radius:50%;
  border:3px solid var(--stamp);color:var(--stamp);display:flex;flex-direction:column;
  align-items:center;justify-content:center;transform:rotate(-12deg);
  font-family:'Nanum Myeongjo';font-weight:800;
}
.result .stamp .big{font-size:30px;}
.result .stamp .sm{font-size:13px;margin-top:2px;letter-spacing:1px;}
.result h2{font-family:'Nanum Myeongjo';font-weight:800;font-size:24px;margin:6px 0;}
.result .rscore{font-size:46px;font-family:'Noto Serif KR';font-weight:900;color:var(--green-deep);margin:4px 0;}
.result .rscore small{font-size:20px;color:var(--ink-soft);font-weight:500;}
.result .rmsg{font-size:14.5px;color:var(--ink-soft);line-height:1.6;margin:8px 0 22px;}
.wrong-review{text-align:left;margin:18px 0 4px;}
.wrong-review .wt{font-size:13px;color:var(--plum);font-weight:700;margin-bottom:10px;letter-spacing:.5px;}
.wrong-item{background:var(--red-soft);border-radius:14px;padding:11px 14px;margin-bottom:8px;font-size:13.5px;line-height:1.5;}
.wrong-item b{font-family:'Nanum Myeongjo';}

.footer{text-align:center;font-size:11.5px;color:var(--ink-soft);opacity:.65;margin-top:30px;line-height:1.6;}
</style>
</head>

세","hanja":"虛張聲勢","meaning":"실력은 없으면서 허세만 떠벌림"},{"word":"형설지공","hanja":"螢雪之功","meaning":"반딧불과 함께하는 노력이란 뜻으로, 고생을 하면서 부지런하고 꾸준하게 공부하는 자세"},{"word":"호가호위","hanja":"狐假虎威","meaning":"여우가 범의 위세를 빌려 다른 짐승을 놀라게 함"},{"word":"호구지책","hanja":"糊口之策","meaning":"가난한 살림에 그저 겨우 먹고 살아가는 방책"},{"word":"호사다마","hanja":"好事多魔","meaning":"좋은 일에는 방해가 되는 일이 많음"},{"word":"호사유피","hanja":"虎死留皮","meaning":"범은 죽어서 가죽을 남긴다는 뜻으로, 사람은 죽어서 이름을 남겨야 함을 이르는 말"},{"word":"호언장담","hanja":"豪言壯談","meaning":"호기롭고 자신 있게 말함"},{"word":"혼연일체","hanja":"渾然一體","meaning":"생각, 행동, 의지 따위가 완전히 하나가 됨"},{"word":"화룡점정","hanja":"畵龍點睛","meaning":"무슨 일을 하는데 가장 긴한 부분을 맞추어서 완성시킴"},{"word":"화중지병","hanja":"畵中之餠","meaning":"그림의 떡, 바라만 보았지 소용이 닿지 않음을 비유"},{"word":"확고부동","hanja":"確固不動","meaning":"확실하고 튼튼하여 마음이 움직이지 않음"},{"word":"환골탈태","hanja":"換骨奪胎","meaning":"사람이 보다 나은 방향으로 변하여 전혀 딴사람처럼 됨"},{"word":"후생가외","hanja":"後生可畏","meaning":"후배들의 발전을 두렵게 생각함"},{"word":"후안무치","hanja":"厚顔無恥","meaning":"낯가죽이 두꺼워서 부끄러운 줄을 모름"},{"word":"후회막급","hanja":"後悔莫及","meaning":"후회를 해도 어찌할 수 없음"},{"word":"흥진비래","hanja":"興盡悲來","meaning":"즐거운 일이 다하면 슬픈 일이 옴, 세상일은 순환되는 것임을 이르는 말"},{"word":"도주지부","hanja":"陶朱之富","meaning":"막대한 재산을 가진 부자","hunmum":"질그릇 도 / 붉을 주 / 어조사 지 / 부유할 부","origin":"도주의 부유함이라는 뜻. 중국에 범려라는 사람이 '도'라는 곳에서 '주'로 이름을 바꾸어 장사를 하여 수만 금을 벌었다는 이야기에서 유래."},{"word":"맹인모상","hanja":"盲人摸象","meaning":"일부분만 알면서 전체를 아는 것처럼 여기는 어리석음","hunmum":"장님 맹 / 사람 인 / 만질 모 / 코끼리 상","origin":"장님이 코끼리를 만진다는 뜻. 전체를 못 보고 자기가 알고 있는 부분만 가지고 고집한다는 말입니다."}]</script>
<div class="wrap">
  <header>
    <span class="badge"><span class="dot"></span>고사성어 · 사자성어<span class="dot"></span></span>
    <h1>쉽게 배우는 <span class="han">四字成語</span></h1>
    <div class="subtitle">한 글자씩 읽고 · 뜻을 익히고 · 퀴즈로 확인해요</div>
  </header>

  <div class="tabs">
    <button class="tab active" data-view="learn">📖 학습</button>
    <button class="tab" data-view="browse">📚 모아보기</button>
    <button class="tab" data-view="quiz">✏️ 퀴즈</button>
  </div>

  <!-- 학습(플래시카드) -->
  <section id="view-learn" class="view">
    <div class="deck-head">
      <span class="deck-title">오늘의 사자성어</span>
      <span class="deck-count"><span id="learnIdx">1</span> / <span id="learnTotal">0</span></span>
    </div>
    <div class="progress"><i id="learnBar"></i></div>
    <div class="flash" id="flash"></div>
  </section>

  <!-- 모아보기 -->
  <section id="view-browse" class="view hidden">
    <input class="search" id="searchBox" placeholder="🔍 사자성어 · 한자 · 뜻으로 검색">
    <div class="mini-list" id="miniList"></div>
  </section>

  <!-- 퀴즈 -->
  <section id="view-quiz" class="view hidden">
    <div id="quizSetup"></div>
    <div id="quizPlay" class="hidden"></div>
    <div id="quizResult" class="hidden"></div>
  </section>

  <div class="footer">
    전체 <span id="footTotal"></span>개 수록 · 학습용 무료 자료<br>
    음성 읽기는 기기·브라우저에 따라 지원이 다를 수 있어요
  </div>
</div>

<script>
(function(){
// 화면에 에러를 표시하는 안전장치 (혹시라도 실행이 멈추면 원인이 보이게)
function showFatal(msg){
  try{
    var f=document.getElementById('flash');
    if(f){ f.innerHTML='<div style="padding:30px;text-align:center;color:#b13a29;font-size:14px;line-height:1.7">앱을 불러오는 중 문제가 발생했어요.<br><br><code style="font-size:11px;color:#888">'+String(msg)+'</code></div>'; }
  }catch(e){}
}
window.addEventListener('error', function(ev){ showFatal(ev.message); });

try{
// JSON 데이터 블록에서 안전하게 읽기
var IDIOMS = JSON.parse(document.getElementById('idiomsData').textContent);
document.getElementById('footTotal').textContent = IDIOMS.length;

/* ============ 음성 읽기 ============ */
let voicesReady = false;
function loadVoices(){ const v=speechSynthesis.getVoices(); if(v.length) voicesReady=true; }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, onend){
  if(!('speechSynthesis' in window)){ if(onend)onend(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='ko-KR'; u.rate=0.9; u.pitch=1.0;
  const ko = speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('ko'));
  if(ko) u.voice=ko;
  if(onend) u.onend=onend;
  speechSynthesis.speak(u);
}
function buildReadScript(item){
  // 한 글자씩 읽어주고 -> 사자성어 -> 뜻 순서
  let parts = [];
  if(item.hunmum){
    const chars = item.word.split('');
    const reads = item.hunmum.split('/').map(s=>s.trim());
    chars.forEach((c,i)=>{ parts.push(c + (reads[i]?(', '+reads[i]):'')); });
  }
  parts.push(item.word + ', ' + item.hanja);
  parts.push('뜻은, ' + item.meaning);
  return parts.join('. ');
}

/* ============ 탭 전환 ============ */
const tabs = document.querySelectorAll('.tab');
tabs.forEach(t=>t.addEventListener('click',()=>{
  tabs.forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  document.getElementById('view-'+t.dataset.view).classList.remove('hidden');
  speechSynthesis && speechSynthesis.cancel();
}));

/* ============ 학습 (플래시카드) ============ */
// 한자 분해(hunmum)+유래가 있는 항목을 앞쪽에, 나머지는 뒤에 배치
const learnDeck = [
  ...IDIOMS.filter(i=>i.hunmum),
  ...IDIOMS.filter(i=>!i.hunmum)
];
let learnPos = 0;
document.getElementById('learnTotal').textContent = learnDeck.length;

function renderFlash(){
  const item = learnDeck[learnPos];
  document.getElementById('learnIdx').textContent = learnPos+1;
  document.getElementById('learnBar').style.width = ((learnPos+1)/learnDeck.length*100)+'%';

  let hunmumHTML = '';
  if(item.hunmum){
    const chars = item.word.split('');
    const reads = item.hunmum.split('/').map(s=>s.trim());
    const hans = item.hanja.split('');
    hunmumHTML = '<div class="hunmum-row">' + chars.map((c,i)=>
      '<div class="hun-chip"><span class="c">'+(hans[i]||c)+'</span><div class="r">'+(reads[i]||c)+'</div></div>'
    ).join('') + '</div>';
  }

  let originHTML = item.origin
    ? '<div class="sec-label"><span class="ln"></span><b>유래 · 예문</b><span class="ln"></span></div><div class="origin">'+item.origin+'</div>'
    : '';

  document.getElementById('flash').innerHTML =
    '<span class="tag">사자성어</span>'+
    '<div class="kor">'+item.word+'</div>'+
    '<div class="han">'+item.hanja+'</div>'+
    hunmumHTML+
    '<div class="sec-label"><span class="ln"></span><b>뜻</b><span class="ln"></span></div>'+
    '<div class="meaning">'+item.meaning+'</div>'+
    originHTML+
    '<div class="flash-foot">'+
      '<button class="read-btn" id="readBtn">🔊 한 글자씩 읽어주기</button>'+
      '<div class="nav-row">'+
        '<button class="nav-btn" id="prevBtn"'+(learnPos===0?' disabled':'')+'>← 이전</button>'+
        '<button class="nav-btn primary" id="nextBtn">'+(learnPos===learnDeck.length-1?'처음으로 ↺':'다음 →')+'</button>'+
      '</div>'+
    '</div>';

  document.getElementById('readBtn').addEventListener('click',function(){
    const btn=this;
    if(btn.classList.contains('playing')){ speechSynthesis.cancel(); btn.classList.remove('playing'); btn.textContent='🔊 한 글자씩 읽어주기'; return; }
    btn.classList.add('playing'); btn.textContent='⏸ 읽는 중... (눌러서 멈춤)';
    speak(buildReadScript(item), ()=>{ btn.classList.remove('playing'); btn.textContent='🔊 한 글자씩 읽어주기'; });
  });
  document.getElementById('prevBtn').addEventListener('click',()=>{ if(learnPos>0){learnPos--; speechSynthesis.cancel(); renderFlash();} });
  document.getElementById('nextBtn').addEventListener('click',()=>{ learnPos=(learnPos+1)%learnDeck.length; speechSynthesis.cancel(); renderFlash(); window.scrollTo({top:0,behavior:'smooth'}); });
}
renderFlash();

/* ============ 모아보기 ============ */
const miniList = document.getElementById('miniList');
function renderBrowse(filter=''){
  const f = filter.trim();
  const list = IDIOMS.filter(i=> !f || i.word.includes(f)||i.hanja.includes(f)||i.meaning.includes(f) );
  miniList.innerHTML = list.length ? list.map(i=>
    '<div class="mini" data-w="'+i.word+'">'+
      '<span class="mk">'+i.word+(i.hunmum?' <span class="star">★</span>':'')+'</span>'+
      '<span class="mh">'+i.hanja+'</span>'+
      '<span class="mm">'+i.meaning+'</span>'+
    '</div>'
  ).join('') : '<div style="text-align:center;color:var(--ink-soft);padding:30px;font-size:14px;">검색 결과가 없어요</div>';

  miniList.querySelectorAll('.mini').forEach(el=>el.addEventListener('click',()=>{
    const item = IDIOMS.find(x=>x.word===el.dataset.w);
    // 학습 탭으로 이동해서 해당 카드 보여주기
    learnPos = learnDeck.findIndex(x=>x.word===item.word);
    tabs.forEach(x=>x.classList.remove('active'));
    document.querySelector('.tab[data-view="learn"]').classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
    document.getElementById('view-learn').classList.remove('hidden');
    renderFlash(); window.scrollTo({top:0,behavior:'smooth'});
  }));
}
renderBrowse();
document.getElementById('searchBox').addEventListener('input',e=>renderBrowse(e.target.value));

/* ============ 퀴즈 ============ */
const quizSetup = document.getElementById('quizSetup');
const quizPlay = document.getElementById('quizPlay');
const quizResult = document.getElementById('quizResult');

let quizCfg = { count:10, mode:'mean2word' };
let quiz = { items:[], cur:0, score:0, wrongs:[], answered:false };

function renderSetup(){
  quizSetup.classList.remove('hidden'); quizPlay.classList.add('hidden'); quizResult.classList.add('hidden');
  quizSetup.innerHTML =
    '<div class="quiz-setup">'+
      '<h2>✏️ 사자성어 퀴즈</h2>'+
      '<p>전체 '+IDIOMS.length+'개 사자성어에서 무작위로 출제돼요.<br>문항 수와 유형을 골라 시작하세요!</p>'+
      '<div class="opt-group"><label>문항 수</label><div class="chips" id="cntChips">'+
        ['10','20','30','전체'].map(c=>'<div class="chip'+( (c==='10'&&quizCfg.count===10) ?' sel':'')+'" data-cnt="'+c+'">'+c+'문제</div>').join('')+
      '</div></div>'+
      '<div class="opt-group"><label>퀴즈 유형</label><div class="chips" id="modeChips" style="flex-direction:column;">'+
        '<div class="chip sel" data-mode="mean2word">뜻 보고 → 사자성어 맞히기</div>'+
        '<div class="chip" data-mode="word2mean">사자성어 보고 → 뜻 맞히기</div>'+
        '<div class="chip" data-mode="han2word">한자 보고 → 사자성어 맞히기</div>'+
        '<div class="chip" data-mode="mixed">랜덤 혼합 (전부 섞기)</div>'+
      '</div></div>'+
      '<button class="start-btn" id="startQuiz">시작하기 →</button>'+
    '</div>';

  quizSetup.querySelectorAll('#cntChips .chip').forEach(c=>c.addEventListener('click',()=>{
    quizSetup.querySelectorAll('#cntChips .chip').forEach(x=>x.classList.remove('sel'));
    c.classList.add('sel');
    quizCfg.count = c.dataset.cnt==='전체'?IDIOMS.length:parseInt(c.dataset.cnt);
  }));
  quizSetup.querySelectorAll('#modeChips .chip').forEach(c=>c.addEventListener('click',()=>{
    quizSetup.querySelectorAll('#modeChips .chip').forEach(x=>x.classList.remove('sel'));
    c.classList.add('sel'); quizCfg.mode=c.dataset.mode;
  }));
  document.getElementById('startQuiz').addEventListener('click',startQuiz);
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function startQuiz(){
  const pool = shuffle(IDIOMS).slice(0, Math.min(quizCfg.count, IDIOMS.length));
  quiz = { items:pool, cur:0, score:0, wrongs:[], answered:false };
  quizSetup.classList.add('hidden'); quizResult.classList.add('hidden'); quizPlay.classList.remove('hidden');
  renderQuestion();
}

function pickMode(){
  if(quizCfg.mode!=='mixed') return quizCfg.mode;
  const modes=['mean2word','word2mean','han2word'];
  return modes[Math.floor(Math.random()*modes.length)];
}

function renderQuestion(){
  const item = quiz.items[quiz.cur];
  const mode = item._mode || (item._mode = pickMode());
  quiz.answered=false;

  // 보기 만들기
  const distractors = shuffle(IDIOMS.filter(x=>x.word!==item.word)).slice(0,3);
  const options = shuffle([item, ...distractors]);

  let typeLabel, promptHTML, getOptText, getCorrect;
  if(mode==='mean2word'){
    typeLabel='뜻을 보고 사자성어 고르기';
    promptHTML='<div class="qmean">'+item.meaning+'</div><div class="qlabel">위 뜻에 맞는 사자성어는?</div>';
    getOptText=o=>o.word+' <span style="color:var(--green-deep);font-family:Nanum Myeongjo;">'+o.hanja+'</span>';
  } else if(mode==='word2mean'){
    typeLabel='사자성어 뜻 고르기';
    promptHTML='<div class="qbig">'+item.word+'</div><div class="qhan">'+item.hanja+'</div><div class="qlabel">이 사자성어의 뜻은?</div>';
    getOptText=o=>o.meaning;
  } else { // han2word
    typeLabel='한자를 보고 사자성어 고르기';
    promptHTML='<div class="qhan" style="font-size:46px;">'+item.hanja+'</div><div class="qlabel">이 한자의 사자성어(한글)는?</div>';
    getOptText=o=>o.word;
  }

  quizPlay.innerHTML =
    '<div class="qbar"><span>문제 '+(quiz.cur+1)+' / '+quiz.items.length+'</span>'+
      '<span class="score">⭐ '+quiz.score+'점</span></div>'+
    '<div class="progress"><i style="width:'+((quiz.cur)/quiz.items.length*100)+'%"></i></div>'+
    '<div class="qcard">'+
      '<div class="qtype">'+typeLabel+'</div>'+
      '<div class="qprompt">'+promptHTML+'</div>'+
      '<div class="answers" id="answers">'+
        options.map((o,i)=>'<button class="ans" data-w="'+o.word+'"><span class="num">'+(i+1)+'</span><span>'+getOptText(o)+'</span></button>').join('')+
      '</div>'+
      '<div id="fbArea"></div>'+
    '</div>';

  quizPlay.querySelectorAll('.ans').forEach(btn=>btn.addEventListener('click',()=>handleAnswer(btn,item,mode)));
}

function handleAnswer(btn, item, mode){
  if(quiz.answered) return;
  quiz.answered=true;
  const chosen = btn.dataset.w;
  const correct = chosen===item.word;
  const answers = quizPlay.querySelectorAll('.ans');
  answers.forEach(a=>{
    a.classList.add('disabled');
    if(a.dataset.w===item.word) a.classList.add('correct');
    else if(a.dataset.w===chosen) a.classList.add('wrong');
  });
  if(correct){ quiz.score+=10; }
  else { quiz.wrongs.push(item); }

  // 정답 음성(틀렸을 때 학습 강화)
  const fb = document.getElementById('fbArea');
  fb.innerHTML = '<div class="feedback">'+
    '<div class="fmark">'+(correct?'🎉':'📌')+'</div>'+
    '<div class="ftext">'+(correct?'정답이에요!':'아쉬워요!')+' <b>'+item.word+' '+item.hanja+'</b><br>'+item.meaning+'</div>'+
    '</div>'+
    '<button class="next-btn" id="nextQ">'+(quiz.cur===quiz.items.length-1?'결과 보기 →':'다음 문제 →')+'</button>';
  document.getElementById('nextQ').addEventListener('click',()=>{
    quiz.cur++;
    if(quiz.cur>=quiz.items.length) renderResult();
    else { renderQuestion(); window.scrollTo({top:0,behavior:'smooth'}); }
  });
}

function renderResult(){
  quizPlay.classList.add('hidden'); quizResult.classList.remove('hidden');
  const total = quiz.items.length*10;
  const pct = Math.round(quiz.score/total*100);
  let stampBig, stampSm, msg;
  if(pct===100){ stampBig='💯'; stampSm='참 잘했어요'; msg='완벽해요! 모든 문제를 맞혔어요!'; }
  else if(pct>=80){ stampBig='참잘'; stampSm='훌륭해요'; msg='아주 잘했어요! 거의 다 맞혔네요.'; }
  else if(pct>=60){ stampBig='good'; stampSm='잘했어요'; msg='좋아요! 틀린 것만 다시 익혀봐요.'; }
  else if(pct>=40){ stampBig='화이팅'; stampSm='조금 더!'; msg='조금만 더 연습하면 돼요. 복습 고고!'; }
  else { stampBig='연습'; stampSm='다시 도전'; msg='괜찮아요! 학습 카드로 다시 익혀봐요.'; }

  let wrongHTML='';
  if(quiz.wrongs.length){
    wrongHTML = '<div class="wrong-review"><div class="wt">📌 틀린 문제 다시 보기 ('+quiz.wrongs.length+')</div>'+
      quiz.wrongs.map(w=>'<div class="wrong-item"><b>'+w.word+' '+w.hanja+'</b> — '+w.meaning+'</div>').join('')+
      '</div>';
  }

  quizResult.innerHTML =
    '<div class="result">'+
      '<div class="stamp"><span class="big">'+stampBig+'</span><span class="sm">'+stampSm+'</span></div>'+
      '<h2>퀴즈 완료!</h2>'+
      '<div class="rscore">'+quiz.score+'<small> / '+total+'점</small></div>'+
      '<div class="rmsg">'+msg+' (정답률 '+pct+'%)</div>'+
      wrongHTML+
      '<button class="start-btn" id="retryBtn" style="margin-top:20px;">다시 풀기 ↺</button>'+
    '</div>';
  document.getElementById('retryBtn').addEventListener('click',renderSetup);
  window.scrollTo({top:0,behavior:'smooth'});
}

renderSetup();

}catch(err){ showFatal(err && err.message ? err.message : err); }
})();
</script>
